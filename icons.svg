<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- 24×24 line icons. Stroke and fill use currentColor, so the badge sets the colour. -->

  <!-- MORPHEUS.ai / verification: a shield with a check -->
  <symbol id="i-verify" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2.8l7.2 2.9v5.6c0 4.6-3 8.3-7.2 10-4.2-1.7-7.2-5.4-7.2-10V5.7z"/>
      <path d="M8.6 12.1l2.4 2.4 4.6-4.8"/>
    </g>
  </symbol>

  <!-- Rung: steps climbing up, with an arrow at the top -->
  <symbol id="i-rung" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 20.5h4.5V16h4.5v-4.5h4.5V7"/>
      <path d="M16.5 7V2.8M14.3 5L16.5 2.8 18.7 5"/>
      <path d="M3 20.5h18"/>
    </g>
    <circle cx="20" cy="7.5" r="1.4" fill="currentColor"/>
  </symbol>

  <!-- trace2wm telemetry: a gauge with a needle -->
  <symbol id="i-gauge" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.5 17a8.5 8.5 0 1 1 17 0"/>
      <path d="M12 17l4.2-5.2"/>
      <path d="M6.2 11.3l1 .8M12 8.1v1.3M17.8 11.3l-1 .8"/>
      <path d="M3.5 20.5h17"/>
    </g>
    <circle cx="12" cy="17" r="1.6" fill="currentColor"/>
  </symbol>

  <!-- Reinforcement learning: a loop around an agent -->
  <symbol id="i-loop" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19.8 12a7.8 7.8 0 1 1-2.3-5.5"/>
      <path d="M19.8 3.8v4.4h-4.4"/>
    </g>
    <circle cx="12" cy="12" r="2.4" fill="currentColor"/>
  </symbol>

  <!-- Environments: a cube -->
  <symbol id="i-cube" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2.8l8 4.5v9.4l-8 4.5-8-4.5V7.3z"/>
      <path d="M4.3 7.4L12 12l7.7-4.6M12 12v9"/>
    </g>
  </symbol>

  <!-- Chip design (Samsung Display) -->
  <symbol id="i-chip" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6.5" y="6.5" width="11" height="11" rx="2"/>
      <rect x="9.7" y="9.7" width="4.6" height="4.6" rx=".8"/>
      <path d="M9.5 2.8v3.7M14.5 2.8v3.7M9.5 17.5v3.7M14.5 17.5v3.7M2.8 9.5h3.7M2.8 14.5h3.7M17.5 9.5h3.7M17.5 14.5h3.7"/>
    </g>
  </symbol>

  <!-- PhD: a graduation cap -->
  <symbol id="i-cap" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2.5 9.2L12 4.5l9.5 4.7L12 14z"/>
      <path d="M6.5 11.3v4.5c0 1.5 2.5 3 5.5 3s5.5-1.5 5.5-3v-4.5"/>
      <path d="M21.5 9.2v5.3"/>
    </g>
  </symbol>

  <!-- Undergraduate: an open book -->
  <symbol id="i-book" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 6.5C9.6 4.9 6.4 4.6 3.2 5.4v13.4c3.2-.8 6.4-.5 8.8 1.1 2.4-1.6 5.6-1.9 8.8-1.1V5.4c-3.2-.8-6.4-.5-8.8 1.1z"/>
      <path d="M12 6.5v13.4"/>
    </g>
  </symbol>

  <!-- "Not possible": a circle with a slash -->
  <symbol id="i-nope" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="8.6"/>
      <path d="M6 6l12 12"/>
    </g>
  </symbol>

  <!-- Judging: a balance -->
  <symbol id="i-scale" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 4v16M8 20h8M5 7.5h14"/>
      <path d="M5 7.5l-2.6 6.2a2.6 2.6 0 0 0 5.2 0zM19 7.5l-2.6 6.2a2.6 2.6 0 0 0 5.2 0z"/>
    </g>
    <circle cx="12" cy="4" r="1.3" fill="currentColor"/>
  </symbol>

  <!-- Agent logs: a page of log lines -->
  <symbol id="i-log" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 2.8h8.2l4 4V21.2H6z"/>
      <path d="M14 2.8v4.2h4.2"/>
      <path d="M8.8 11.5h1.4M12.4 11.5h3M8.8 14.8h1.4M12.4 14.8h3M8.8 18h1.4M12.4 18h1.8"/>
    </g>
  </symbol>
</svg>
